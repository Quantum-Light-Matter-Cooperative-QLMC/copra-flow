[project]
name = "copra-flow"
version = "0.1.1"
description = "Trace-conditioned flow refinement for TG-FROG ultrafast pulse retrieval."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Atal Narayan Sahu"}]
dependencies = [
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.6; python_version == '3.11'",
    "numpy==2.5.1; python_version >= '3.12'",
    "scipy==1.15.3; python_version < '3.11'",
    "scipy==1.17.1; python_version == '3.11'",
    "scipy==1.18.0; python_version >= '3.12'",
    "matplotlib>=3.8,<4",
    "h5py>=3.10,<4",
    "tqdm>=4.66,<5",
    "torch==2.5.1",
]

[project.scripts]
copra-flow = "pnp_copra.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypret = ["LICENSE"]

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*invalid escape sequence.*:SyntaxWarning:pypret.*",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
